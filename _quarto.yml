project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!teaching.qmd"
    - "!cv.qmd"

website:
  title: "Chih-Yu Lin"
  site-url: "https://dululu29.github.io"
  description: "Academic homepage of Chih-Yu Lin — learning-based resource allocation, information freshness, ISAC/ISCC, NOMA, satellite communications, and vehicular networks."
  favicon: images/favicon.svg
  image: images/ChihYu.jpg
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: contact.qmd
        text: Contact
    right:
      - icon: github
        href: https://github.com/dululu29
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/chih-yu-lin-287948113/
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Chih-Yu Lin"

format:
  html:
    theme: flatly
    css: styles.css
    include-after-body: _includes/cloudflare-analytics.html
    toc: false
    code-copy: true
    grid:
      sidebar-width: 0px
      body-width: 900px
      margin-width: 0px
      gutter-width: 1.5rem

execute:
  freeze: auto
